    <meta property="og:description" content="بطاقات الأعمال الذكية، منتجات NFC، ودليل الأعمال السوري الشامل. كل ما تحتاجه لبناء حضور رقمي احترافي يضمن تصدّرك في نتائج البحث والخرائط." />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // fetch property guard setup error fallback
        }
      })();
    </script>
